[project]
name = "vesuvius-autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm for high-value AI bounties"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.8.7",
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "s3fs>=2026.2.0",
    "seaborn>=0.13.2",
    "tensorstore>=0.1.78",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
    "vesuvius>=0.2.4",
    "zarr>=2.18.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
