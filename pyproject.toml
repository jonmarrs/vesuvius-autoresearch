[project]
name = "vesuvius-autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm for high-value AI bounties"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alphashape>=1.3.1",
    "connected-components-3d",
    "crackle-codec>=0.42.0",
    "cupy-cuda12x>=14.0.1",
    "dynamic-network-architectures>=0.4.3",
    "fpdf2>=2.8.7",
    "imagecodecs>=2025.3.30",
    "kernels>=0.11.7",
    "kimimaro>=5.8.1",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "nest-asyncio>=1.6.0",
    "nnunetv2>=2.6.2",
    "numpy>=2.2.6",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pybind11>=3.0.4",
    "pytorch-lightning",
    "pytorch-optimizer>=3.10.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "s3fs>=2026.2.0",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "segmentation-models-pytorch",
    "shapely>=2.1.2",
    "tensorboard>=2.20.0",
    "tensorstore>=0.1.78",
    "tiktoken>=0.11.0",
    "timesformer-pytorch",
    "torch==2.9.1",
    "volumentations>=0.1.9",
    "wandb>=0.26.1",
    "warmup-scheduler",
    "webknossos>=2.5.0",
    "zarr>=2.18.3",
    "pre-commit",
    "posix-ipc>=1.3.2",
    "typed-argument-parser",
    "accelerate>=1.13.0",
    "albumentations<1.4",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts/training"]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv",
    "__pycache__",
    "local_data",
    "predictions",
    "reports",
    "submission_package_dry_run",
    "test_cache",
    "test_cache2",
    "villa",
    "wandb",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "villa", # Submodules have their own configs
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatter or ignored for extreme cases)
    "E402", # Module level import not at top of file
    "SIM102", # Nested if statements
    "SIM105", # Use contextlib.suppress
    "SIM108", # Use ternary operator
    "SIM115", # Use context manager for opening files
    "SIM117", # Nested with statements
    "SIM118", # Use key in dict instead of key in dict.keys()
    "B007",   # Loop control variable not used
    "F841",   # Local variable assigned but never used
    "F401",   # Unused import
    "C414",   # Unnecessary list() within sorted()
    "C419",   # Unnecessary list comprehension
    "C401",   # Unnecessary generator (rewrite as set comprehension)
    "UP038",  # Use X | Y in isinstance
    "E722",   # Bare except
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["vesuvius_model", "vesuvius_loader", "train", "predict"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["union-attr", "attr-defined", "operator", "index", "arg-type", "assignment", "no-any-return", "var-annotated"]
exclude = [
    "villa",
    ".venv",
]
