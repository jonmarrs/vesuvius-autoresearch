[project]
name = "vesuvius-autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm for high-value AI bounties"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alphashape>=1.3.1",
    "connected-components-3d",
    "crackle-codec>=0.42.0",
    "cupy-cuda12x>=14.0.1",
    "dynamic-network-architectures>=0.4.3",
    "fpdf2>=2.8.7",
    "imagecodecs>=2025.3.30",
    "kernels>=0.11.7",
    "kimimaro>=5.8.1",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "nest-asyncio>=1.6.0",
    "numpy>=2.2.6",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pybind11>=3.0.4",
    "pytorch-lightning",
    "pytorch-optimizer>=3.10.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "s3fs>=2026.2.0",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "segmentation-models-pytorch",
    "shapely>=2.1.2",
    "tensorboard>=2.20.0",
    "tensorstore>=0.1.78",
    "tiktoken>=0.11.0",
    "timesformer-pytorch",
    "torch==2.9.1",
    "volumentations>=0.1.9",
    "wandb>=0.26.1",
    "warmup-scheduler",
    "webknossos>=2.5.0",
    "zarr>=2.18.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".venv",
    "__pycache__",
    "local_data",
    "predictions",
    "reports",
    "submission_package_dry_run",
    "test_cache",
    "test_cache2",
    "villa",
    "wandb",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
