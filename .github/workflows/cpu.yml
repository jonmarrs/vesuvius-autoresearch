name: Portable CPU checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/ci-cpu.txt
      - name: Install portable test tools
        timeout-minutes: 3
        run: |
          python -m venv "$RUNNER_TEMP/portable-venv"
          "$RUNNER_TEMP/portable-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/ci-cpu.txt
      - name: Lint maintained Python sources
        timeout-minutes: 1
        run: '"$RUNNER_TEMP/portable-venv/bin/ruff" check . --extend-exclude repro/villa_preserved,repro/gp_winner'
      - name: Run portable workflow contracts
        timeout-minutes: 3
        run: '"$RUNNER_TEMP/portable-venv/bin/python" scripts/run_validation_tests.py --profile portable -- --tb=short --maxfail=1 -o faulthandler_timeout=60'
