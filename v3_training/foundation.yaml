tr_setup:
  model_name: "v3_foundation_lejepa"
  vram_max: 24
  autoconfigure: true
  ckpt_out_base: "./v3_checkpoints/"
  tensorboard_log_dir: "./v3_logs/"

tr_config:
  optimizer: "AdamW"
  initial_lr: 1.0e-3
  weight_decay: 1.0e-2
  patch_size: [24, 64, 64]
  batch_size: 2
  num_dataloader_workers: 4
  max_epoch: 1
  use_lejepa: true
  sigreg_lambda: 0.02

model_config:
  base_feat: 64
  in_channels: 1

dataset_config:
  use_cache: true
  cache_folder: "v3_patch_cache"

targets:
  ink:
    out_channels: 1
    loss_fn: "BCEDiceLoss"
    volumes:
      - format: "zarr_local"
        data_volume: "local_data/PHercParis2Fr47/surface_volume.zarr"
        label_volume: "local_data/PHercParis2Fr47/inklabels_filled.png"
