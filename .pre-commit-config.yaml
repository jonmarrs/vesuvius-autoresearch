# Loop-managed state files are rewritten continuously by the autoresearch loop
# (often without a trailing newline). Excluding them stops end-of-file-fixer /
# trailing-whitespace from modifying them mid-commit, which otherwise conflicts
# with pre-commit's stash/restore and blocks commits while the loop runs.
# repro/villa_preserved/ holds byte-identical copies of upstream villa files that
# upstream has since DELETED. Linting or reformatting them defeats the point: a
# silently reformatted copy of someone else's file is worse than no copy, because
# it looks authoritative and is not. Learned the hard way -- ruff auto-fixed 53
# issues across them on the first commit attempt, and tests/test_villa_preserved.py
# caught the drift.
exclude: '^(config\.json|autoresearch_history\.json|recent_configs\.json|history\.tsv|prize_readiness\.tsv|\.current_day_shift_log|repro/villa_preserved/.*)$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # A unified diff encodes a blank context line as a single space. Trimming
        # it rewrites the patch's payload, and a patch that silently stops applying
        # is exactly the failure repro/spiral_render/serial_folds.patch exists to
        # avoid. GNU patch and git apply both tolerated the trimmed form when this
        # first happened, which is worse, not better: it would have rotted quietly.
        exclude: '\.patch$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Default is 500KB; raised to accommodate verbose autoresearch sprint logs
        # (per-cycle config dumps push them past 500KB). Still guards against
        # accidentally committing model weights / large binaries.
        args: [--maxkb=2048]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy . --explicit-package-bases --namespace-packages
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: doc-guards
        name: doc reference and claim guards
        # These caught a report citing a file that does not exist, on 2026-09-19 --
        # after it had already been committed, because the guard was run by hand in a
        # statement that was not chained to the commit. 2.9s is cheap insurance
        # against a stale reference reaching main, which is the failure this repo's
        # own docstring says cost it three months.
        # test_arm_tiers: a misfiled arm silently corrupts a correlation (2026-09-19).
        # test_audit_arm_coverage: an arm scored but used by nothing, or named but
        # absent, means an analysis is quietly running on a different sample than
        # its author thinks -- the cause of both corrections made that same day.
        entry: ./.venv/bin/python -m pytest tests/test_audit_doc_references.py tests/test_audit_report_claims.py tests/test_withdrawn_claims_stay_withdrawn.py tests/test_arm_tiers.py tests/test_audit_arm_coverage.py tests/test_analyse_flat_displacement.py tests/test_quotations_match_source.py tests/test_analyse_pooled_fit_only_floor.py tests/test_analyse_ink_maximum_offset.py -q --no-header
        language: system
        pass_filenames: false
        files: '\.(md|py)$'
